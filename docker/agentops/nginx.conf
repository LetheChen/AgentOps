# AgentOps 单镜像 nginx 配置
#
# 端口：0.0.0.0:80（容器内由 nginx 前台进程监听）
# 反代：/api/* 与 /docs → 127.0.0.1:1987（容器内 uvicorn）
#
# 关键点：
#   - SPA fallback：所有非 /api 请求都打到 index.html
#   - SSE 长连接：关闭 proxy_buffering
#   - WebSocket：Upgrade 头透传
#   - 静态资源 7 天缓存

upstream agentops_api {
    server 127.0.0.1:1987;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # ── 安全头 ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 客户端上传 / 响应体上限 ────────────────────
    client_max_body_size 50m;

    # ── 静态资源 + SPA fallback ───────────────────
    root /usr/share/nginx/html;
    index index.html;

    # favicon / 静态资源直接命中
    location ~* \.(?:css|js|map|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|wasm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # SPA fallback：所有非 /api 请求都打到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── /api 反向代理到容器内 uvicorn ─────────────
    location /api/ {
        proxy_pass http://agentops_api;

        # 头透传
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（覆盖默认 60s；某些 agent run 可能 5+ 分钟）
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # SSE：关闭缓冲 + 禁用缓存
        proxy_buffering       off;
        proxy_cache           off;
        proxy_set_header Connection        "";

        # HTTP/1.1 + keepalive
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # ── /docs（FastAPI swagger UI） ───────────────
    location /docs {
        proxy_pass http://agentops_api;
        proxy_set_header Host $host;
    }

    # ── 健康检查 ──────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
