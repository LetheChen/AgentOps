# config/tools/task_dispatch_scan.yaml
# P2 自动调度：task_dispatcher 派发扫描（只读，判定逻辑 100% 确定性）
# 设计文档：docs/product-design/DESIGN_task_lifecycle_automation_v1.md §5.6
tool_id: task_dispatch_scan
display_name: 调度派发扫描
description: |
  扫描 decomposing 态任务：叶子 + 依赖就绪 + 风险门禁（low/medium 自动）→ 就绪清单；
  high 风险 → 人工确认清单；依赖未就绪/父任务等子任务 → 挂起清单；
  子任务全完成的父任务 → 收尾候选。并发占用 = in_progress 任务数（保守口径）。
  纯只读，配置读 config/dispatch.yaml。
input_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目过滤（空 = 全项目，可选）
handler:
  module: tools.task_dispatch_scan
  function: task_dispatch_scan
  config:
    timeout_seconds: 30
allowed_domains: [task_management]
audit:
  log_args: true
  log_result: true
